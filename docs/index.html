<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DEEPSPACE//NET — Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020a12;
      --panel: #04121d;
      --text: #6fd9e8;
      --dim: #2e6b7a;
      --accent: #19e3ff;
      --glow: rgba(25, 227, 255, 0.45);
      --authAdmin: #c77dff;
      --authUser: #ffc857;
      --authGuest: #5f7a87;
    }

    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      font-family: "Share Tech Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
    }

    body {
      background: radial-gradient(ellipse at 50% -20%, #06222f 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }

    /* vignette */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    /* CRT scanlines + flicker */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 20, 30, 0.28) 3px);
      animation: flicker 4s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.78; }
      94% { opacity: 1; }
      97% { opacity: 0.9; }
      98% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      body::after { animation: none; }
    }

    #rain {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
      word-wrap: break-word;
    }

    .header {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .badge {
      background: rgba(2, 16, 25, 0.85);
      padding: 6px 10px;
      border: 1px solid rgba(25, 227, 255, 0.25);
      border-radius: 4px;
      color: var(--text);
      font-size: 13px;
      text-shadow: 0 0 6px var(--glow);
      box-shadow: 0 0 8px rgba(25, 227, 255, 0.12), inset 0 0 8px rgba(25, 227, 255, 0.06);
    }

    .badge.title {
      color: var(--accent);
      letter-spacing: 2px;
    }

    .telemetry {
      margin-left: auto;
      text-align: right;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.35;
      white-space: pre;
      text-shadow: 0 0 4px rgba(25, 227, 255, 0.25);
    }

    #radar {
      width: 56px;
      height: 56px;
      border: 1px solid rgba(25, 227, 255, 0.25);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(25, 227, 255, 0.15);
      background: rgba(2, 16, 25, 0.85);
    }

    .main {
      display: flex;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: linear-gradient(180deg, rgba(3, 20, 31, 0.92), rgba(2, 12, 20, 0.88));
      border: 1px solid rgba(25, 227, 255, 0.22);
      box-shadow: 0 0 14px rgba(25, 227, 255, 0.10), inset 0 0 22px rgba(25, 227, 255, 0.04);
      padding: 12px;
      border-radius: 6px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      width: clamp(280px, 26vw, 420px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .sideBox {
      background: rgba(2, 14, 22, 0.88);
      border: 1px solid rgba(25, 227, 255, 0.18);
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(25, 227, 255, 0.08);
      padding: 8px;
    }

    .sideTitle {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-shadow: 0 0 6px var(--glow);
    }

    .syslog {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      font-size: 11px;
      color: var(--dim);
      min-height: 0;
    }

    .syslog div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .syslog div:last-child {
      color: var(--text);
      text-shadow: 0 0 4px rgba(25, 227, 255, 0.3);
    }

    #activePrograms div {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      overflow-wrap: anywhere;
    }

    #spark {
      width: 100%;
      height: 42px;
      display: block;
    }

    .volRow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--dim);
      margin: 4px 0;
    }

    .volRow span {
      width: 28px;
      letter-spacing: 1px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 3px;
      background: rgba(25, 227, 255, 0.25);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--glow);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--glow);
      cursor: pointer;
    }

    .sideBox.grow {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .output {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px;
      border-radius: 4px;
      background: rgba(0, 5, 9, 0.55);
      box-shadow: inset 0 0 14px rgba(25, 227, 255, 0.05);
      min-height: 0;
      word-wrap: break-word;
    }

    .line {
      white-space: pre-wrap;
      margin: 2px 0;
      font-size: 13px;
      text-shadow: 0 0 5px rgba(25, 227, 255, 0.35);
    }

    [class*="cmd-"] {
      text-shadow: 0 0 5px currentColor;
    }

    .cmd-help { color: #ffd166; }
    .cmd-ls, .cmd-pwd, .cmd-cd { color: #6fb8ff; }
    .cmd-cat, .cmd-echo { color: #e8f6ff; }
    .cmd-whoami, .cmd-mem { color: #c77dff; }
    .cmd-scan { color: #4dff9d; }
    .cmd-connect, .cmd-disconnect { color: #ff9f5b; }
    .cmd-run { color: #ff6ec7; }
    .cmd-rm, .cmd-error { color: #ff5b5b; }
    .cmd-save, .cmd-load, .cmd-reset, .cmd-changeAuth { color: #ffc857; }
    .bf-success { color: #4dff9d; }
    .bf-fail { color: #ff5b5b; }

    .line.clickable {
      cursor: pointer;
      color: #4dff9d;
      text-shadow: 0 0 6px rgba(77, 255, 157, 0.45);
    }

    .line.clickable:hover {
      background: rgba(77, 255, 157, 0.1);
      color: #8dffbe;
      text-shadow: 0 0 9px rgba(77, 255, 157, 0.7);
    }

    .prompt {
      color: var(--accent);
      text-shadow: 0 0 7px var(--glow);
    }

    .inputRow {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .inputRow::before {
      content: "▸";
      color: var(--accent);
      text-shadow: 0 0 7px var(--glow);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0.15; }
    }

    @media (prefers-reduced-motion: reduce) {
      .inputRow::before { animation: none; }
    }

    .cwdAuthAdmin {
      min-width: 160px;
      color: var(--authAdmin);
      font-size: 13px;
      text-shadow: 0 0 6px rgba(199, 125, 255, 0.5);
    }

    .cwdAuthUser {
      min-width: 160px;
      color: var(--authUser);
      font-size: 13px;
      text-shadow: 0 0 6px rgba(255, 200, 87, 0.5);
    }

    .cwdAuthGuest {
      min-width: 160px;
      color: var(--authGuest);
      font-size: 13px;
      text-shadow: 0 0 6px rgba(95, 122, 135, 0.5);
    }

    input.cmd {
      flex: 1;
      background: rgba(0, 5, 9, 0.6);
      border: 1px solid rgba(25, 227, 255, 0.25);
      padding: 8px;
      border-radius: 4px;
      color: var(--text);
      caret-color: var(--accent);
      font-family: inherit;
      font-size: 13px;
      text-shadow: 0 0 5px rgba(25, 227, 255, 0.35);
      outline: none;
    }

    input.cmd:focus {
      border-color: rgba(25, 227, 255, 0.55);
      box-shadow: 0 0 10px rgba(25, 227, 255, 0.2);
    }

    button {
      background: rgba(25, 227, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(25, 227, 255, 0.4);
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      text-shadow: 0 0 6px var(--glow);
    }

    button:hover {
      background: rgba(25, 227, 255, 0.22);
      box-shadow: 0 0 10px rgba(25, 227, 255, 0.25);
    }

    .small {
      font-size: 12px;
      color: var(--dim);
    }

    .status {
      display: flex;
      gap: 8px;
    }

    @media (max-width:900px) {
      .sidebar { display: none; }
      .telemetry { display: none; }
    }

    @media (max-width:700px) {
      .cwdAuthAdmin { display: none; }
      .cwdAuthUser { display: none; }
      .cwdAuthGuest { display: none; }
    }
  </style>
  <script type="module" crossorigin src="/game-my-hacknet-proto/assets/index-CsZZsZzX.js"></script>
</head>

<body>
  <canvas id="rain"></canvas>
  <div class="container" id="app">
    <div class="header">
      <div class="badge title">DEEPSPACE//NET</div>
      <div class="badge status small">Mem: <span id="memUsed">0</span>/<span id="memTot">1024</span> Mo</div>
      <div class="badge small" id="connBadge">offline</div>
      <div class="telemetry" id="telemetry"></div>
      <canvas id="radar" width="112" height="112"></canvas>
    </div>

    <div class="main">
      <div class="panel">
        <div class="output" id="output" tabindex="0"></div>

        <form id="form" class="inputRow" autocomplete="off">
          <div class="cwdAuthAdmin" id="cwd">/home$</div>
          <input id="cmd" class="cmd" placeholder="Tape une commande (help)..." />
          <button type="submit">Entrer</button>
        </form>

        <div class="small" style="margin-top:8px">Prototype: commandes simples — persistance IndexedDB activée.</div>
      </div>

      <aside class="sidebar">
        <div class="sideBox">
          <div class="sideTitle">NET FEED</div>
          <div class="syslog" id="netfeed"></div>
        </div>
        <div class="sideBox">
          <div class="sideTitle">ACTIVE PROGRAMS</div>
          <div class="syslog" id="activePrograms"></div>
        </div>
        <div class="sideBox grow">
          <div class="sideTitle">SYS LOG</div>
          <div class="syslog" id="syslog"></div>
        </div>
        <div class="sideBox">
          <div class="sideTitle">NET ACTIVITY</div>
          <canvas id="spark" width="214" height="42"></canvas>
        </div>
        <div class="sideBox">
          <div class="sideTitle">AUDIO</div>
          <label class="volRow"><span>BGM</span>
            <input id="bgmVol" type="range" min="0" max="1" step="0.01" />
          </label>
          <label class="volRow"><span>SFX</span>
            <input id="sfxVol" type="range" min="0" max="1" step="0.01" />
          </label>
        </div>
      </aside>
    </div>
  </div>

</body>

</html>
